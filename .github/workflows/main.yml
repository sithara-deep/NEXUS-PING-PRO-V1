name: Build Nexus Ping Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip nexus-ping-pro-flutter-app.zip -d project

      - name: Find project root
        id: find
        shell: bash
        run: |
          FILE=$(find project -name pubspec.yaml -o -name package.json | head -1)
          if [ -z "$FILE" ]; then
            echo "No supported project found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/pubspec.yaml" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
          else
            echo "type=react" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.find.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter APK
        if: steps.find.outputs.type == 'flutter'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Setup Node.js
        if: steps.find.outputs.type == 'react'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React App
        if: steps.find.outputs.type == 'react'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          npx cap init "Nexus Ping Pro" "com.nexuspingpro.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React APK
        if: steps.find.outputs.type == 'react'
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Ping-Pro-APK
          path: |
            ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
            ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
