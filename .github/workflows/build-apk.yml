name: Build Nexus Ping Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir project
          unzip nexus-ping-pro-flutter-app.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd project
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Website
        run: |
          cd project
          npm run build

      - name: Setup Capacitor
        run: |
          cd project
          npx cap init "Nexus Ping Pro" "com.nexuspingpro.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Ping-Pro-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
